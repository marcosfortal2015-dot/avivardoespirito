<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ícone do site -->
    <link rel="icon" type="image/png" href="/logo-icone.png" />
    <link rel="apple-touch-icon" href="/logo-icone.png" />
    <meta name="theme-color" content="#2C2340" />

    <!-- Compartilhamento em redes sociais (WhatsApp, Facebook, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ministério Avivar do Espírito" />
    <meta property="og:title" content="Ministério Avivar do Espírito" />
    <meta property="og:description" content="Uma igreja cristã interdenominacional com forte viés pentecostal. Cultos, estudos bíblicos, Códigos Avivar, Loja Avivar e muito mais." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ministério Avivar do Espírito" />
    <meta name="twitter:description" content="Uma igreja cristã interdenominacional com forte viés pentecostal. Cultos, estudos bíblicos, Códigos Avivar, Loja Avivar e muito mais." />
    <meta name="twitter:image" content="https://avivardoespirito.com.br/logo-fundo-preto.jpg" />

    <!-- Dados estruturados para o Google entender que este site é de uma igreja -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",
        "name": "Ministério Avivar do Espírito",
        "url": "https://avivardoespirito.com.br/",
        "logo": "https://avivardoespirito.com.br/logo-icone.png",
        "description": "Ministério Avivar do Espírito — uma igreja cristã interdenominacional com forte viés pentecostal."
      }
    </script>
    <!-- Louvor Avivar do Espírito como aplicativo próprio: só age quando o link tem ?app=music (e ?u=<unidade> para outras igrejas) -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get("app") !== "music") return;
          var u = q.get("u");
          if (u === null) { try { u = localStorage.getItem("am-unidade") || ""; } catch (e) { u = ""; } }
          if (u === "principal") u = "";
          var l = document.createElement("link");
          l.rel = "manifest";
          if (u) {
            // cada unidade (igreja) instala o seu próprio ícone, que reabre direto na unidade certa
            var o = location.origin;
            var m = {
              id: "/?app=music&u=" + u, name: "Louvor Avivar do Espírito", short_name: "Louvor Avivar",
              description: "Escalas, repertório e cifras do ministério de louvor.", lang: "pt-BR",
              start_url: "/?app=music&u=" + encodeURIComponent(u), scope: "/", display: "standalone",
              orientation: "portrait-primary", background_color: "#351052", theme_color: "#351052",
              icons: [
                { src: o + "/avivar-music-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
                { src: o + "/avivar-music-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
                { src: o + "/avivar-music-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
              ]
            };
            l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
          } else {
            l.href = "/manifest-music.json";
          }
          document.head.appendChild(l);
          document.title = "Louvor Avivar do Espírito";
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", "#351052");
          var ai = document.querySelector('link[rel="apple-touch-icon"]');
          if (ai) ai.setAttribute("href", "/avivar-music-180.png");
          var ic = document.querySelector('link[rel="icon"]');
          if (ic) ic.setAttribute("href", "/avivar-music-192.png");
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
              navigator.serviceWorker.register("/sw-music.js").catch(function () {});
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
